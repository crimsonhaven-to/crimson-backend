# One host, bundled PostgreSQL, one backend container that serves and runs every
# background loop. Production (Swarm, external Patroni) is docker-stack.yml.
#
#   cp .env.example .env            # set TMDB_API_KEY and PROXY_SECRET
#   docker compose up --build
#
# Optional services are profiles: `--profile downloads` adds aria2 (set
# ARIA2_RPC_SECRET in .env first), `--profile discord` adds the invite bot.
#
# If exposed publicly, keep :8000 behind a TLS-terminating proxy. The app builds
# absolute URLs from X-Forwarded-Proto/Host, so direct access lets anyone spoof
# X-Forwarded-Host.

x-database-url: &database-url postgresql://${POSTGRES_USER:-crimson}:${POSTGRES_PASSWORD:-crimson}@postgres:5432/${POSTGRES_DB:-crimson}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimson}
      POSTGRES_USER: ${POSTGRES_USER:-crimson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimson}
    volumes:
      - crimson-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crimson} -d ${POSTGRES_DB:-crimson}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    image: crimson-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Every optional setting comes straight from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      # Without it signed links break on every restart.
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in .env (openssl rand -hex 32)}
      DATABASE_URL: *database-url
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
    # Local sources and the download target: mount, then register the in-container
    # path in Admin. aria2 must see the media library at the same path.
    # volumes:
    #   - /srv/media:/crimson/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The resync runs before uvicorn binds :8000, so the first boot is slow.
      start_period: 600s
    stop_grace_period: 20s
    restart: unless-stopped

  # seed-time=0 per download, so no inbound BitTorrent port. PUID/PGID match the
  # api image's appuser so the backend can move finished files.
  aria2:
    image: p3terx/aria2-pro
    profiles: [downloads]
    environment:
      # Not `:?`, which would also fail a plain `up` without the profile.
      RPC_SECRET: ${ARIA2_RPC_SECRET:-}
      RPC_PORT: "6800"
      PUID: "10001"
      PGID: "10001"
      DISK_CACHE: 64M
      UPDATE_TRACKERS: "true"
    volumes:
      - crimson-aria2-config:/config
      # - /srv/media:/crimson/media
    restart: unless-stopped

  # A second gateway login with the same token fights the first.
  discord-bot:
    image: crimson-backend:local
    profiles: [discord]
    command: ["python", "-m", "discord_bot"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    restart: unless-stopped

volumes:
  crimson-pgdata:
  crimson-aria2-config:
