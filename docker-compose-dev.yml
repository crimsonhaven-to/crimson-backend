# Single-node dev stack: same image and env contract as docker-stack.yml, but with
# a bundled PostgreSQL and one backend container that both serves and owns the
# resync (production splits that into `api` and `api-sync`).
#
#   TMDB_API_KEY=... PROXY_SECRET=$(openssl rand -hex 32) \
#   docker compose -f docker-compose-dev.yml up --build
#
# If exposed publicly, keep it behind a TLS-terminating reverse proxy: the app
# builds absolute iframe URLs from X-Forwarded-Proto/Host, so a directly reachable
# port lets anyone spoof X-Forwarded-Host.
version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-crimson}
      - POSTGRES_USER=${POSTGRES_USER:-crimson}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crimson}
    volumes:
      - crimson-pgdata-dev:/var/lib/postgresql/data
    # Loopback only, so host psql access never exposes the DB to the LAN.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crimson} -d ${POSTGRES_DB:-crimson}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    # Uncomment build: so `--build` works from a checkout without pushing an image.
    image: crimson-backend:1.0
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?set TMDB_API_KEY in the environment or an .env file}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crimson}:${POSTGRES_PASSWORD:-crimson}@postgres:5432/${POSTGRES_DB:-crimson}
      # Without it a random per-process secret is used, and signed proxy URLs
      # break on every restart.
      - PROXY_SECRET=${PROXY_SECRET:?set PROXY_SECRET (e.g. openssl rand -hex 32)}
      # Compose does not inject .env into the container, so every optional setting
      # below must be listed to take effect.
      #
      # crimson-proxy edge relays for the no-extension path. Unset, POST /sign
      # returns 503 and clients fall back to the extension. Comma-separate hosts for
      # failover; each proxy's NITRO_PROXY_SECRET must equal PROXY_SECRET.
      - CRIMSON_PROXY_BASE=${CRIMSON_PROXY_BASE:-}
      # The only replica, so it owns the Fribb resync (api-sync in production).
      - RUN_DB_SYNC=true
      # Unset uses the built-in dev + crimsonhaven origins.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Optional features, disabled when unset.
      - KOFI_VERIFICATION_TOKEN=${KOFI_VERIFICATION_TOKEN:-}
      # /changelog reads GitHub Releases; unset token means 503. Read access only
      # (fine-grained PAT with Contents:read, or classic repo scope).
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-crimsonhaven-to/crimson-backend}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME:-}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD:-}
      # ShowBox/Febbox direct-file source; disables itself when unset.
      - FEBBOX_UI_TOKEN=${FEBBOX_UI_TOKEN:-}
      - FEBBOX_REGION=${FEBBOX_REGION:-}
      # Player subtitles; unset means /subtitles returns 503.
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_APP_NAME=${OPENSUBTITLES_APP_NAME:-CrimsonHaven v1.0}
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-true}
      # Gates email and mnemonic signup alike, so a fresh client-side keypair
      # cannot bypass it. Empty closes registration: every signup 403s.
      - SIGNUP_INVITE_CODE=${SIGNUP_INVITE_CODE:-}
      # Comma-separated; seeds /admin access.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      # Verification and password-reset email.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-CrimsonHaven}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # Chat provider keys live in env, not the settings table, so a database dump
      # never holds billable credentials. Unset, /chat answers 503. Only the
      # provider selected in Admin -> Chat needs a key. Mind the `$`: without it
      # the literal string passes the feature gate and every call fails with 400.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

    # Local direct-play source: mount a directory, then register the in-container
    # path (e.g. /crimson/movies1) in Admin -> Sources. :ro is enough because the
    # backend only reads. Direct play only: mp4/m4v/mov/webm.
    # volumes:
    #   - /movies:/crimson/movies1:ro
    #   - /mnt/nas/anime:/crimson/anime:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The resync runs before uvicorn binds :8000, so the first boot is slow.
      start_period: 600s

    stop_grace_period: 20s
    restart: unless-stopped

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Optional Discord invite bot: idles unless DISCORD_BOT_TOKEN is set. One
  # replica only, since a second gateway login with the same token fights the first.
  discord-bot:
    image: crimson-backend:1.0
    command: ["python", "-m", "discord_bot"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crimson}:${POSTGRES_PASSWORD:-crimson}@postgres:5432/${POSTGRES_DB:-crimson}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID:-}
      - DISCORD_COMMAND_PREFIX=${DISCORD_COMMAND_PREFIX:-!}
      # For the "register at <url>" hint next to minted invite codes.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  crimson-pgdata-dev:
