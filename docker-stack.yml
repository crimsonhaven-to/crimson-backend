# Production Swarm stack, for reference. The live copy is ~/crimson-deploy on the
# manager and CI never ships this file (see .gitlab-ci.yml).
#
#   TMDB_API_KEY=... PROXY_SECRET=$(openssl rand -hex 32) \
#   DATABASE_URL=postgresql://crimson:PASS@db-1,db-2,db-3:5432/crimson?target_session_attrs=read-write \
#   docker stack deploy -c docker-stack.yml crimson
#
# One image, one role per service. Every service of a role shares its env, and
# only one process may run each singleton loop, hence:
#
# | Service         | Replicas | Owns                                  |
# | --------------- | -------- | ------------------------------------- |
# | api             | 3        | all HTTP traffic, publishes :8000     |
# | api-sync        | 1        | Fribb resync, airing notifications    |
# | cache-worker    | 1        | ffmpeg cache loop                     |
# | download-worker | 1        | aria2 poll loop                       |
# | aria2           | 1        | the download queue itself             |
# | discord-bot     | 1        | invite bot (idle without a token)     |
# | pruner          | global   | removes old release images per node   |
#
# Keep :8000 behind a TLS-terminating proxy. The app builds absolute URLs from
# X-Forwarded-Proto/Host, so direct access lets anyone spoof X-Forwarded-Host.
#
# Each api replica holds up to DB_POOL_MAX (10) connections, so past about 8
# replicas put PgBouncer in front (deploy/pgbouncer/README.md).
#
# Compose does not pass the manager's env file into containers, so every setting
# a service reads is listed here.
version: "3.8"

x-image: &image ${CRIMSON_API_IMAGE:-registry.ramon.moe/crimsonhaven-to/crimson-backend:latest}

x-core-env: &core-env
  TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  # Identical everywhere, or signed links 403 on another replica or after a restart.
  PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://crimsonhaven.to,https://www.crimsonhaven.to}
  # Unset leaves /metrics admin-only. Must equal the crimson_metrics_token secret.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  RUN_DB_SYNC: "false"
  RUN_CACHE_WORKER: "false"
  RUN_DOWNLOAD_WORKER: "false"

# Cached streams are pulled back through the worker's own proxies, so both api and
# cache-worker need the source credentials.
x-source-env: &source-env
  JELLYFIN_URL: ${JELLYFIN_URL:-}
  JELLYFIN_USERNAME: ${JELLYFIN_USERNAME:-}
  JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD:-}
  FEBBOX_UI_TOKEN: ${FEBBOX_UI_TOKEN:-}
  FEBBOX_REGION: ${FEBBOX_REGION:-}

x-aria2-env: &aria2-env
  ARIA2_RPC_URL: ${ARIA2_RPC_URL:-http://aria2:6800/jsonrpc}
  ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}

x-health: &health
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

x-restart: &restart
  condition: any
  delay: 5s
  window: 60s

# Singletons never overlap: two copies would run the same loop at once.
x-singleton-update: &singleton-update
  parallelism: 1
  delay: 10s
  order: stop-first
  failure_action: rollback
  monitor: 30s
  max_failure_ratio: 0.3

x-singleton-rollback: &singleton-rollback
  parallelism: 1
  delay: 5s
  order: stop-first

services:
  api:
    image: *image
    environment:
      <<: [*core-env, *source-env, *aria2-env]
      KOFI_VERIFICATION_TOKEN: ${KOFI_VERIFICATION_TOKEN:-}
      # Read-only PAT for /changelog; unset answers 503.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-crimsonhaven-to/crimson-backend}
      # Only api answers /admin. Unset shows the live snapshot without history.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_APP_NAME: ${OPENSUBTITLES_APP_NAME:-CrimsonHaven v1.0}
      REQUIRE_LOGIN: ${REQUIRE_LOGIN:-true}
      # Empty closes registration for email and mnemonic signup alike.
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://crimsonhaven.to}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CrimsonHaven}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Env, not the settings table, so a database dump never holds billable keys.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CRIMSON_PROXY_BASE: ${CRIMSON_PROXY_BASE:-}
    # Serves /cache_proxy, so it needs the NAS mounts (see volumes at the bottom).
    # volumes:
    #   - crimson_cache1:/crimson/cache1
    #   - crimson_cache2:/crimson/cache2
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    healthcheck: *health
    stop_grace_period: 20s
    deploy:
      replicas: 3
      restart_policy: *restart
      update_config:
        <<: *singleton-update
        # Schema init takes an advisory lock, so replicas may overlap.
        order: start-first
      rollback_config:
        <<: *singleton-rollback
        order: start-first
      resources:
        limits: {cpus: "1.50", memory: 768M}
        reservations: {cpus: "0.25", memory: 256M}
    networks: [crimson_net]

  api-sync:
    image: *image
    environment:
      <<: *core-env
      RUN_DB_SYNC: "true"
      AIRING_NOTIFY_ENABLED: ${AIRING_NOTIFY_ENABLED:-false}
      AIRING_NOTIFY_DRY_RUN: ${AIRING_NOTIFY_DRY_RUN:-true}
    healthcheck:
      <<: *health
      # Uvicorn binds only after the resync, which takes minutes on every boot. A
      # shorter window kills the task mid-sync, forever.
      start_period: 600s
    stop_grace_period: 20s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *singleton-update
      rollback_config: *singleton-rollback
      resources:
        # The resync holds the whole Fribb mapping. Exit 137 means raise this.
        limits: {cpus: "1.50", memory: 768M}
        reservations: {cpus: "0.25", memory: 256M}
    networks: [crimson_net]

  # Polls for `pending` rows that api writes, so jobs survive an api roll.
  cache-worker:
    image: *image
    environment:
      <<: [*core-env, *source-env]
      RUN_CACHE_WORKER: "true"
    # Same NAS mounts and paths as api.
    # volumes:
    #   - crimson_cache1:/crimson/cache1
    #   - crimson_cache2:/crimson/cache2
    healthcheck: *health
    # Lets an in-flight remux finish; a kill marks the row failed for a retry.
    stop_grace_period: 120s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *singleton-update
      rollback_config: *singleton-rollback
      resources:
        # The audio re-encode fallback is heavy.
        limits: {cpus: "2.00", memory: 1024M}
        reservations: {cpus: "0.25", memory: 256M}
    networks: [crimson_net]

  # api, aria2 and download-worker must mount the media library at the same
  # in-container path, so a job's <root>/crimson-downloads is valid in all three.
  download-worker:
    image: *image
    environment:
      <<: [*core-env, *aria2-env]
      RUN_DOWNLOAD_WORKER: "true"
    # volumes:
    #   - crimson_media:/crimson/media
    healthcheck: *health
    stop_grace_period: 20s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: *singleton-update
      rollback_config: *singleton-rollback
      resources:
        limits: {cpus: "0.50", memory: 384M}
        reservations: {cpus: "0.10", memory: 128M}
    networks: [crimson_net]

  # seed-time=0 per download, so no inbound BitTorrent port. PUID/PGID match the
  # api image's appuser so the worker can move finished files.
  aria2:
    image: p3terx/aria2-pro
    environment:
      RPC_SECRET: ${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}
      RPC_PORT: "6800"
      PUID: "10001"
      PGID: "10001"
      DISK_CACHE: 64M
      UPDATE_TRACKERS: "true"
    # volumes:
    #   - crimson_media:/crimson/media
    healthcheck:
      test: ["NONE"]
    stop_grace_period: 20s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: {parallelism: 1, delay: 10s, order: stop-first}
      resources:
        limits: {cpus: "1.00", memory: 512M}
        reservations: {cpus: "0.10", memory: 64M}
    networks: [crimson_net]

  # A second gateway login with the same token fights the first and double-mints.
  discord-bot:
    image: *image
    command: ["python", "-m", "discord_bot"]
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      DISCORD_COMMAND_PREFIX: ${DISCORD_COMMAND_PREFIX:-!}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://crimsonhaven.to}
    # Nothing listens on :8000, so the image's check would restart it forever.
    healthcheck:
      test: ["NONE"]
    stop_grace_period: 20s
    deploy:
      replicas: 1
      restart_policy: *restart
      update_config: {parallelism: 1, delay: 10s, order: stop-first}
      resources:
        limits: {cpus: "0.25", memory: 128M}
        reservations: {cpus: "0.05", memory: 32M}
    networks: [crimson_net]

  # Swarm never removes old images, so each node piles up tens of GB of releases.
  # Keeps the newest 3 vX.Y.Z tags and un-force removes the rest, so the daemon
  # refuses anything a running or rollback container still uses. It runs once and
  # exits (0/0 tasks is healthy); PRUNE_RELEASE changes every release, which is
  # what reschedules it. The socket mount is root on the node.
  pruner:
    image: docker:28-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        IMAGE="registry.ramon.moe/crimsonhaven-to/crimson-backend"
        KEEP=3
        # busybox has no reliable `sort -V`, and v1.10.0 must outrank v1.9.0.
        tags="$(docker image ls --format '{{.Tag}}' "$IMAGE" 2>/dev/null \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sed 's/^v//' | sort -t. -k1,1nr -k2,2nr -k3,3nr \
                  | sed 's/^/v/' || true)"
        old="$(echo "$tags" | tail -n +$((KEEP + 1)))"
        for t in $old; do
          if docker image rm "${IMAGE}:${t}" >/dev/null 2>&1; then
            echo "[pruner] removed ${IMAGE}:${t}"
          else
            echo "[pruner] kept (in use) ${IMAGE}:${t}"
          fi
        done
        docker image prune -f >/dev/null 2>&1 || true
    environment:
      PRUNE_RELEASE: *image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["NONE"]
    deploy:
      mode: global
      # A failed pass is retried at the next release.
      restart_policy: {condition: none}
      resources:
        limits: {cpus: "0.25", memory: 64M}
        reservations: {cpus: "0.01", memory: 16M}

networks:
  crimson_net:
    driver: overlay
    attachable: true

# Optional NAS volumes for the video cache and the media library. Swarm mounts
# them on whichever node runs the task. uid/gid 10001 is the image's appuser.
#
