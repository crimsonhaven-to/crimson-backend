# Dev tooling for the CI gate only. The app runs from source under uvicorn, so
# there is no [build-system].

[tool.pytest.ini_options]
# No test needs the network or a database, so the suite runs anywhere.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["__pycache__", ".venv-test", "data", "dist"]

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
# Most third-party dependencies ship no type stubs.
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/", ".venv-test/", "data/"]
