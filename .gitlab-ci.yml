#   push to `main`  build :dev-<sha> and roll the crimson-dev stack
#   v* tag          build :<tag> + :latest, roll prod, build and roll the
#                   sourceless demo stack
#
# Deploys only run deploy.sh on the manager. The stack files there
# (~/crimson-deploy, ~/dev-crimson-deploy, ~/demo-crimson-deploy) are edited in
# place; the ones in this repo are references and never shipped.

stages:
  - security
  - gate
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  # The runner runs as `gitlab-runner`, so the login user must be explicit.
  SWARM_MANAGER: raymond@crimsonswarm01

# A second release must wait, not race the rolling update.
default:
  interruptible: false

.main_push:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

.main_or_release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"

# Quality gate
gate:
  extends: .main_or_release
  stage: gate
  tags: [docker]
  image: python:3.14-slim
  variables:
    PIP_ROOT_USER_ACTION: ignore
  script:
    - echo "Install dev + runtime deps"
    - python -m pip install --upgrade pip --no-cache-dir
    - pip install --no-cache-dir -r requirements-dev.txt
    - echo "Lint (ruff, correctness rules)"
    - ruff check .
    - echo "Type-check (mypy)"
    - mypy .
    - echo "Unit tests (pytest)"
    - pytest

.buildx_setup:
  before_script:
    - docker buildx create --name crimson --driver docker-container --driver-opt network=host 2>/dev/null || true
    - docker buildx use crimson
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:
  extends:
    - .main_or_release
    - .buildx_setup
  stage: build
  tags: [crimsonrunner]
  needs: [gate]
  resource_group: crimson-backend-$CI_COMMIT_REF_NAME
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="$CI_COMMIT_TAG"
        echo "VERSION=${VER}"    >> build.env
        echo "DEPLOY=true"       >> build.env
        TAGS="--tag ${IMAGE}:${VER} --tag ${IMAGE}:latest"
        echo "IMAGE_TAG=${VER}"  >> build.env
      else
        SHORT_SHA="$(git rev-parse --short HEAD)"
        echo "VERSION="          >> build.env
        echo "DEPLOY=false"      >> build.env
        TAGS="--tag ${IMAGE}:dev --tag ${IMAGE}:dev-${SHORT_SHA}"
        # Deploy the immutable per-commit tag, not the rolling :dev, so the
        # dev stack always rolls to exactly this build.
        echo "IMAGE_TAG=dev-${SHORT_SHA}" >> build.env
      fi
      echo "Building ${TAGS}"
      # Optional overlays (https://docs.crimsonhaven.org). With a CI/CD variable set
      # to "group/project" on this GitLab, the Dockerfile bakes that repo in:
      #
      # | Variable     | Bakes in                                   |
      # | ------------ | ------------------------------------------ |
      # | SOURCES_REPO | resolvers/, scrapers/ and manga/           |
      # | MUSIC_REPO   | music/, its Python packages and Deno       |
      #
      # Unset, no --secret flags are passed and the build is the plain public image.
      # Auth is CI_JOB_TOKEN for both, so there is no PAT to rotate. Each overlay
      # project must allow this one:
      #   <overlay project> > Settings > CI/CD > Job token permissions > add crimson-backend
      OVERLAY_ARGS=""
      export SOURCES_TOKEN="$CI_JOB_TOKEN"
      if [ -n "${SOURCES_REPO:-}" ]; then
        export SOURCES_TARGET="${CI_SERVER_HOST}/${SOURCES_REPO}"
        OVERLAY_ARGS="--secret id=sources_repo,env=SOURCES_TARGET"
        echo "Source overlay: ${SOURCES_TARGET}@main"
      else
        echo "Source overlay: none (SOURCES_REPO unset)"
      fi
      if [ -n "${MUSIC_REPO:-}" ]; then
        export MUSIC_TARGET="${CI_SERVER_HOST}/${MUSIC_REPO}"
        OVERLAY_ARGS="$OVERLAY_ARGS --secret id=music_repo,env=MUSIC_TARGET"
        echo "Music overlay: ${MUSIC_TARGET}@main"
      else
        echo "Music overlay: none (MUSIC_REPO unset)"
      fi
      if [ -n "$OVERLAY_ARGS" ]; then
        # BuildKit does not hash secret content into the cache key and the clone RUNs
        # never change, so without a per-pipeline OVERLAY_REV the cached layers are
        # reused and new overlay commits are silently never baked in.
        OVERLAY_ARGS="$OVERLAY_ARGS --secret id=sources_token,env=SOURCES_TOKEN"
        OVERLAY_ARGS="$OVERLAY_ARGS --build-arg OVERLAY_REV=${CI_PIPELINE_ID}"
      fi
      docker buildx build \
        --push \
        $TAGS \
        $OVERLAY_ARGS \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        .
  artifacts:
    reports:
      dotenv: build.env

deploy:
  extends: .release
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-prod
  environment:
    name: production
    url: https://crimsonhaven.to
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/crimson-deploy/deploy.sh '${VERSION}'"

deploy-dev:
  extends: .main_push
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-dev
  environment:
    name: dev
    url: https://dev.crimsonhaven.to
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/dev-crimson-deploy/deploy.sh '${IMAGE_TAG}'"

# The demo image must carry no private sources, so it gets no overlay secrets and
# its own cache ref (:democache) so it can never restore a source-bearing layer
# from the prod cache. The demo stack also sets PRIVATE_SOURCES_ENABLED=0.
build-demo:
  extends:
    - .release
    - .buildx_setup
  stage: build
  tags: [crimsonrunner]
  needs: [gate]
  resource_group: crimson-backend-demo
  script:
    - |
      set -eu
      VER="$CI_COMMIT_TAG"
      # Deploy the immutable tag, not the rolling :demo.
      echo "DEMO_IMAGE_TAG=demo-${VER}" >> demo.env
      docker buildx build \
        --push \
        --tag "${IMAGE}:demo" \
        --tag "${IMAGE}:demo-${VER}" \
        --cache-from "type=registry,ref=${IMAGE}:democache" \
        --cache-to "type=registry,ref=${IMAGE}:democache,mode=max" \
        .
  artifacts:
    reports:
      dotenv: demo.env

deploy-demo:
  extends: .release
  stage: deploy
  tags: [crimsonrunner]
  needs: [build-demo]
  resource_group: crimson-demo
  environment:
    name: demo
    url: https://demo.crimsonhaven.org
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/demo-crimson-deploy/deploy.sh '${DEMO_IMAGE_TAG}'"

# GitLab Dependency Scanning is gated on $GITLAB_FEATURES, which CE never sets, so
# it would silently scan nothing. Trivy needs no licence.
#
# The first pass prints every severity; only the second can fail, so HIGH and
# CRITICAL block a deploy. Dependencies only, not the image: base-image OS findings
# are rarely actionable here and would wedge every deploy.
scan-deps:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy fs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 .
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

# Renovate opens one MR per available update. Schedule-only, and skipped without
# RENOVATE_TOKEN so the pipeline stays green before setup. Setup: add a group CI/CD
# variable RENOVATE_TOKEN (PAT with `api` scope), then create a pipeline schedule.
renovate:
  stage: security
  tags: [docker]
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@crimsonhaven.to>"
    LOG_LEVEL: info
  script:
    - renovate
