# GitLab CI/CD — translated from .github/workflows/build-image.yml, which is left
# in place so the project still builds on GitHub.
#
# Build the backend image and push it to the PRIVATE GitLab Container Registry,
# then roll it out to the Docker Swarm.
#
#   * push to `dev`   -> build + push registry.ramon.moe/.../crimson-backend:dev
#                        (and :dev-<sha>), then roll the crimson-dev stack.
#   * a v* tag        -> build + push :<tag> and :latest, then deploy that
#                        immutable :<tag> to the swarm with a health-gated,
#                        auto-rolling update. ALSO builds a separate, CLEAN demo
#                        image (:demo / :demo-<tag>) — NO private source overlay
#                        baked in — and rolls it onto the crimson-demo stack
#                        (DEMO_MODE=1, sourceless). See build-demo below.
#
# The image is PRIVATE: this project's container registry is set to "Only project
# members", independent of the repository being public. Pull auth reaches the swarm
# nodes two ways:
#   - CI push uses the ephemeral CI_REGISTRY_PASSWORD (the job token).
#   - Runtime pulls use a durable read_registry deploy token configured once on the
#     manager (crimsonswarm01); `docker stack deploy --with-registry-auth` ships
#     those credentials to every node so re-pulls survive reboots/reschedules.
#
# Runner: `crimsonrunner`, the base-OS shell runner on the jumphost server10, which
# has Docker + buildx and passwordless SSH to the swarm managers. The quality gate
# runs on the containerised `docker` runner instead — it needs no host access.
#
# Two deliberate differences from the GitHub original:
#   * GitHub fired the production path on a *published Release*; GitLab has no such
#     pipeline trigger, so production is driven by pushing a v* tag. Create the
#     GitLab release from that tag afterwards if you want release notes.
#   * GitHub's `paths-ignore: '**.md'` has no GitLab counterpart and a `changes:`
#     allowlist over this many top-level packages would silently skip a deploy the
#     day a new package appears. Doc-only commits to `dev` therefore rebuild. If
#     that becomes annoying, push docs to a branch and merge without a dev commit.

stages:
  - gate
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  # The swarm manager the deploy is driven against (reachable from the runner).
  # The runner runs as the `gitlab-runner` user, so the login user is explicit here.
  SWARM_MANAGER: raymond@crimsonswarm01

# Never let two builds/deploys of the same ref run concurrently (a second release
# must wait, not race the rolling update).
default:
  interruptible: false

.dev_push:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

.dev_or_release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "dev"

# Quality gate — MUST pass before anything is built or deployed. Runs the
# correctness linter (ruff pyflakes) + the fixture-based unit tests (pure
# parsing/crypto/signing logic; no network, no DB). Runs inside the exact prod
# base image (python:3.14-slim) so "it imports/installs in CI" == "it imports
# in the deployed container".
#
# On GitHub this ran as a `container:` job on the self-hosted runner and had to
# chmod the shared workspace back to the host user afterwards. Here it is an
# ordinary containerised job on the docker runner with its own throwaway
# workspace, so that hand-back step is gone.
gate:
  extends: .dev_or_release
  stage: gate
  tags: [docker]
  image: python:3.14-slim
  variables:
    PIP_ROOT_USER_ACTION: ignore
  script:
    - echo "Install dev + runtime deps"
    - python -m pip install --upgrade pip --no-cache-dir
    - pip install --no-cache-dir -r requirements-dev.txt
    - echo "Lint (ruff — correctness rules)"
    - ruff check .
    - echo "Type-check (mypy — informational, non-blocking)"
    - mypy . || true
    - echo "Unit tests (pytest)"
    - pytest

.buildx_setup:
  before_script:
    # docker/setup-buildx-action has no GitLab equivalent. The shell runner keeps
    # its builder between jobs, so the create is a no-op after the first run (and
    # is ignored if a concurrent job won the race); the docker-container driver is
    # what makes the registry-backed cache work.
    # network=host matters: BuildKit runs in its own container and would otherwise
    # resolve registry.ramon.moe through public DNS to the Cloudflare Tunnel, whose
    # 100MB request body cap rejects large layers with a 413. On the host network it
    # picks up /etc/hosts, which points the registry at the LAN address instead.
    - docker buildx create --name crimson --driver docker-container --driver-opt network=host 2>/dev/null || true
    - docker buildx use crimson
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:
  extends:
    - .dev_or_release
    - .buildx_setup
  stage: build
  tags: [crimsonrunner]
  needs: [gate]
  resource_group: crimson-backend-$CI_COMMIT_REF_NAME
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER="$CI_COMMIT_TAG"
        echo "VERSION=${VER}"    >> build.env
        echo "DEPLOY=true"       >> build.env
        TAGS="--tag ${IMAGE}:${VER} --tag ${IMAGE}:latest"
        echo "IMAGE_TAG=${VER}"  >> build.env
      else
        SHORT_SHA="$(git rev-parse --short HEAD)"
        echo "VERSION="          >> build.env
        echo "DEPLOY=false"      >> build.env
        TAGS="--tag ${IMAGE}:dev --tag ${IMAGE}:dev-${SHORT_SHA}"
        # Deploy the immutable per-commit tag, not the rolling :dev, so the
        # dev stack always rolls to exactly this build.
        echo "IMAGE_TAG=dev-${SHORT_SHA}" >> build.env
      fi
      echo "Building ${TAGS}"
      # Optional build-time source overlay (see self-hosting docs): a clone URL
      # and token passed as BuildKit secrets. Unset = empty = the build skips the
      # overlay. Never baked into a layer. To enable, add SOURCES_PAT/SOURCES_REPO
      # as masked CI/CD variables and uncomment the two --secret lines.
      docker buildx build \
        --push \
        $TAGS \
        --cache-from "type=registry,ref=${IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
        .
      #   --secret id=sources_pat,env=SOURCES_PAT \
      #   --secret id=sources_repo,env=SOURCES_REPO \
  artifacts:
    reports:
      # The GitHub job outputs, carried the GitLab way.
      dotenv: build.env

deploy:
  extends: .release
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-prod
  environment:
    name: production
    url: https://crimsonhaven.to
  script:
    # Checked out at the release tag, so we ship THIS release's stack definition.
    - echo "Ship stack file to the manager"
    - scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new docker-stack.yml "${SWARM_MANAGER}:/home/raymond/crimson-deploy/docker-stack.yml"
    - echo "Deploy to the swarm"
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/crimson-deploy/deploy.sh '${VERSION}'"

# Dev auto-deploy: a push to `dev` rolls the just-built dev-<sha> image onto the
# crimson-dev stack. Unlike the prod deploy this ships NO stack file — the dev
# docker-stack.yml lives only on the manager (~/dev-crimson-deploy/), bundling
# its own Postgres; CI just triggers its deploy.sh.
deploy-dev:
  extends: .dev_push
  stage: deploy
  tags: [crimsonrunner]
  needs: [build]
  resource_group: crimson-dev
  environment:
    name: dev
    url: https://dev.crimsonhaven.to
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/dev-crimson-deploy/deploy.sh '${IMAGE_TAG}'"

# --- Demo image: a CLEAN build with NO private source overlay -----------------
# Built only on a release tag, alongside the prod `build`. It deliberately OMITS the
# sources_pat/sources_repo BuildKit secrets, so the Dockerfile's private-sources
# stage is a no-op and NONE of secret-backend-sources is baked into the image. A
# SEPARATE buildcache ref (:democache) guarantees the clean build can never restore
# a source-bearing layer from the prod cache. The crimson-demo stack runs this with
# DEMO_MODE=1 + PRIVATE_SOURCES_ENABLED=0, so the demo resolves nothing.
build-demo:
  extends:
    - .release
    - .buildx_setup
  stage: build
  tags: [crimsonrunner]
  needs: [gate]
  resource_group: crimson-backend-demo
  script:
    - |
      set -eu
      VER="$CI_COMMIT_TAG"
      # Deploy the immutable per-release demo tag, not the rolling :demo.
      echo "DEMO_IMAGE_TAG=demo-${VER}" >> demo.env
      # NOTE: no --secret flags on purpose — without sources_pat/sources_repo the
      # Dockerfile skips the overlay clone, so the demo image carries none of the
      # private backend sources. Its own buildcache ref keeps it source-free.
      docker buildx build \
        --push \
        --tag "${IMAGE}:demo" \
        --tag "${IMAGE}:demo-${VER}" \
        --cache-from "type=registry,ref=${IMAGE}:democache" \
        --cache-to "type=registry,ref=${IMAGE}:democache,mode=max" \
        .
  artifacts:
    reports:
      dotenv: demo.env

# Demo auto-deploy on release: roll the just-built demo-<tag> image onto the
# crimson-demo stack. Like the dev deploy it ships NO stack file — the demo
# docker-stack.yml lives only on the manager (~/demo-crimson-deploy/), bundling its
# own Postgres and the DEMO_MODE env; CI just triggers its deploy.sh.
deploy-demo:
  extends: .release
  stage: deploy
  tags: [crimsonrunner]
  needs: [build-demo]
  resource_group: crimson-demo
  environment:
    name: demo
    url: https://demo.crimsonhaven.to
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" "/home/raymond/demo-crimson-deploy/deploy.sh '${DEMO_IMAGE_TAG}'"
