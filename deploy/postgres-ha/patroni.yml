# Identical on all three hosts. Per-host identity, addresses, etcd endpoints and
# passwords come from PATRONI_* variables in docker-compose.yml and override this.
#
# `bootstrap:` is read only when the cluster is first created, then lives in etcd.
# Editing it here afterwards does nothing; use `patronictl edit-config`.

bootstrap:
  dcs:
    ttl: 30                          # leader lease seconds; lose it -> failover
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576 # 1 MiB: never promote a too-far-behind standby
    synchronous_mode: true           # a write is ACKed only once a standby also has it
    postgresql:
      use_pg_rewind: true            # cheap re-sync of an old primary after failover
      use_slots: true                # replication slots so WAL isn't dropped too early
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 256MB
        password_encryption: scram-sha-256
        # Pushes queue up until `stanza-create` has run (README §8).
        archive_mode: "on"
        archive_command: 'pgbackrest --stanza=crimson archive-push %p'

  initdb:
    - encoding: UTF8
    - data-checksums                 # detect silent disk corruption early

  post_init: /etc/patroni/init-app-db.sh

  # Edit the CIDRs to match your networks (README §5).
  pg_hba:
    # pgBackRest and patronictl connect over the Unix socket as the postgres OS
    # user, so peer auth needs no password. Must stay above 'local all all'
    # because pg_hba is first-match-wins.
    - local   all             postgres                             peer
    - local   all             all                                  scram-sha-256
    - host    all             all       127.0.0.1/32               scram-sha-256
    - host    all             all       ::1/128                    scram-sha-256
    # Patroni reads its own timeline over a loopback replication connection. `all`
    # does not match the `replication` database, so without these a restarted
    # node cannot read its timeline and never recovers.
    - host    replication     replicator 127.0.0.1/32             scram-sha-256
    - host    replication     replicator ::1/128                  scram-sha-256
    # DB hosts, for replication and pg_rewind
    - host    all             all       192.168.2.0/24             scram-sha-256
    - host    replication     replicator 192.168.2.0/24            scram-sha-256
    # Swarm app network
    - host    all             all       10.0.0.0/8                 scram-sha-256
    - host    replication     replicator 10.0.0.0/8                scram-sha-256

postgresql:
  # After a role change the local PgBouncer keeps advertising the node's previous
  # role (pgbouncer#859), so read-write routing breaks. The script issues RECONNECT;
  # see its header. It sits in the pgdata mount so it can be added to a running
  # cluster with `patronictl reload` alone (README §6e).
  callbacks:
    on_role_change: /var/lib/postgresql/data/on-role-change.sh
    on_start: /var/lib/postgresql/data/on-role-change.sh

  bin_dir: /usr/lib/postgresql/17/bin
  # A sub-folder, so an ext4 mount-point `lost+found` never collides with it.
  data_dir: /var/lib/postgresql/data/pgroot
  pgpass: /tmp/pgpass

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
