# Replication copies a bad DELETE/DROP to every standby instantly; only these
# backups undo it. Keep the repo off the database hosts (S3 block below) so a site
# loss does not take the backups with it.

[global]
# Local repo, under PGBACKREST_REPO from .env
repo1-path=/var/lib/pgbackrest
# pgBackRest rejects trailing inline comments, so every comment sits on its own line.
repo1-retention-full=4
repo1-bundle=y
compress-type=zst
start-fast=y
# A wedged archive command must not fill the disk and take Postgres down.
archive-push-queue-max=2GiB

# Off-site repo (recommended): replace the repo1-path and repo1-retention-full
# lines above with an S3-compatible target (B2, Wasabi, S3, MinIO, ...):
#
# repo1-type=s3
# repo1-path=/crimson
# repo1-s3-bucket=crimson-pg-backups
# repo1-s3-endpoint=s3.us-west-002.backblazeb2.com
# repo1-s3-region=us-west-002
# repo1-s3-key=<access-key-id>
# repo1-s3-key-secret=<secret-access-key>
# repo1-retention-full=4

[crimson]
# Must match data_dir/port in patroni.yml.
pg1-path=/var/lib/postgresql/data/pgroot
pg1-port=5432
# Relies on the `local all postgres peer` rule in patroni.yml, so no password.
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
