# A separate stack on the API's overlay network, so an API deploy never touches
# the monitoring service: a backend rollout is exactly when metrics must stay up.
# Setup steps are in README.md.
#
# Nothing is published. Prometheus has no auth and its query API reads every
# metric, so it is reachable only from inside crimson_net and via an SSH tunnel.
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v3.7.3

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The dashboard offers a 30 day range, so keep at least that much or the
      # longest range draws a chart that starts partway across. The admin UI reads
      # this back through /api/v1/status/flags and says so when the two disagree.
      - --storage.tsdb.retention.time=45d
      # A ceiling as well as a time limit, so a traffic spike cannot fill the disk.
      # Whichever limit is hit first wins.
      - --storage.tsdb.retention.size=8GB
      - --web.listen-address=0.0.0.0:9090
      # Stated so nobody enables unauthenticated /-/reload and /-/quit. kingpin
      # needs this form: `--web.enable-lifecycle=false` exits 1 on boot.
      - --no-web.enable-lifecycle

    configs:
      - source: crimson_prometheus_yml
        target: /etc/prometheus/prometheus.yml

    secrets:
      # Must equal the backend's METRICS_TOKEN, or every scrape gets a 401.
      - source: crimson_metrics_token
        target: metrics_token
        # prom/prometheus runs as uid 65534 (nobody), so the secret is owned by it.
        uid: "65534"
        gid: "65534"
        mode: 0400

    volumes:
      - prometheus_data:/prometheus

    healthcheck:
      # The image has no curl or wget, but ships promtool.
      test: ["CMD", "promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # An unclean shutdown costs a slow WAL replay on the next start.
    stop_grace_period: 60s

    deploy:
      replicas: 1
      placement:
        constraints:
          # The TSDB is a local volume, so a different node means an empty
          # database. A manager-role constraint is not enough with several managers.
          - node.hostname == ${PROMETHEUS_NODE:?set PROMETHEUS_NODE to the host that keeps the metrics volume}
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        # Two processes must never share the TSDB directory; with start-first the
        # new one would fail to acquire the lock.
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "1.00"
          # Headroom for the head block plus query working set. A handful of
          # replicas at a few hundred series each sits far below it; raise it if
          # you add scrape targets.
          memory: 1024M
        reservations:
          cpus: "0.10"
          memory: 256M

    networks:
      - crimson_net

configs:
  crimson_prometheus_yml:
    external: true

secrets:
  crimson_metrics_token:
    external: true

volumes:
  prometheus_data:
    driver: local

networks:
  # Created by the API stack; shared so the backend reaches http://prometheus:9090.
  # Production: crimson_crimson_net (stack `crimson` + network `crimson_net`).
  crimson_net:
    external: true
    name: ${CRIMSON_NETWORK:-crimson_crimson_net}
