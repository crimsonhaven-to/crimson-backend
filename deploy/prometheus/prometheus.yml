# Deployed as a Swarm config. The scrape credential comes from a Swarm secret, so
# this file is safe to commit and to `docker config inspect`.

global:
  # 15s matches the step of the dashboard's shortest range (1h), so the finest
  # chart is drawing roughly one point per scrape rather than interpolating.
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: crimsonhaven

scrape_configs:
  # `tasks.<service>` resolves to every replica's IP; the bare service name is one
  # load-balanced VIP. Counters are per process, so scraping the VIP would hop
  # between replicas and make every counter sawtooth. Per-task discovery also makes
  # `count(up)` a true replica count and `max(crimson_schema_version)` a
  # rolling-deploy detector.
  #
  # Must match JOB in core/prom_query.py; every panel filters on it.
  - job_name: crimson-api
    dns_sd_configs:
      # Swarm names services <stack>_<service> and production deploys the API as
      # stack `crimson`, so the prefix is `crimson_`, not `crimson-api_`. A wrong
      # prefix is not an error; it silently discovers nothing.
      - names:
          - tasks.crimson_api
          - tasks.crimson_api-sync
          - tasks.crimson_cache-worker
          - tasks.crimson_download-worker
        type: A
        port: 8000
        # Faster than the 30s default: rescheduled tasks get new IPs, and a stale
        # record silently stops scraping that replica.
        refresh_interval: 15s

    metrics_path: /metrics
    # /metrics (system_engine/metrics_routes.py) accepts METRICS_TOKEN as a bearer
    # or an admin session. Prometheus trims whitespace around the credentials file,
    # so a trailing newline is harmless, but the token must not contain spaces.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

    relabel_configs:
      # `instance` (ip:8000) changes whenever a task is rescheduled, so also
      # record the service to tell `api` from `cache-worker` in a query.
      - source_labels: [__meta_dns_name]
        regex: 'tasks\.(.+)'
        target_label: service
        replacement: '$1'

  # Cheap, and it shows when the scraper is falling behind.
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
