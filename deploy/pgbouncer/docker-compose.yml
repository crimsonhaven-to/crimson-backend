# One copy per database host, next to deploy/postgres-ha. Host networking so the
# bouncer listens on the host's :6432 and reaches its own Postgres on 127.0.0.1.
# Nothing here is host-specific. See README.md.

services:
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    image: crimson-pgbouncer:1
    network_mode: host
    restart: unless-stopped

    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro

    # pg_isready never authenticates, so this stays green on leader and standby
    # alike. -U crimson avoids pg_isready defaulting to the OS user (pgb), which
    # makes PgBouncer log "no such user: pgb" on every probe.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "crimson", "-d", "crimson"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
