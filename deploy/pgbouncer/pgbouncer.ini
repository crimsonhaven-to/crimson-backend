;; Identical on all three database hosts. Each bouncer fronts its own node's
;; PostgreSQL; the app's multi-host DATABASE_URL with target_session_attrs=read-write
;; finds whichever bouncer fronts the current leader, so failover needs no VIP.

[databases]
;; 127.0.0.1 pins each bouncer to its own node, so it can never front another host.
crimson = host=127.0.0.1 port=5432 dbname=crimson

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Empty values override the Alpine package defaults, which point at
;; /var/log/pgbouncer (not writable by the unprivileged user). Logs go to stderr
;; for Docker.
logfile =
pidfile =

;; scram-sha-256 matches the cluster's password_encryption (patroni.yml). The
;; auth_file secret is used both to verify the app and to log in to PostgreSQL.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling decouples app clients (max_client_conn) from Postgres
;; backends (default_pool_size), so the API tier scales without multiplying
;; connections. Safe because the app keeps no session state across transactions
;; (no LISTEN/NOTIFY, SET SESSION, session advisory locks or WITH HOLD cursors).
;; Needs app-side prepared statements off: DB_PREPARE_THRESHOLD defaults to
;; disabled in core/db_pool.py.
pool_mode = transaction

;; Client connections are just sockets to PgBouncer, so a high cap is cheap.
max_client_conn = 1000

;; Only the leader's bouncer carries traffic, so the primary sees at most
;; default_pool_size + reserve_pool_size (~30) backends for the whole API tier.
;; Raise only if SHOW POOLS shows cl_waiting > 0 at peak.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Safety rail well below Postgres' max_connections (100).
max_db_connections = 50

;; Recycle server connections so links to a failed-over old primary do not linger.
;; Too slow to fix the stale role after a failover (pgbouncer#859); that is
;; postgres-ha/on-role-change.sh's job.
server_lifetime = 600
server_idle_timeout = 120
server_check_query = select 1

;; psycopg sends this startup parameter; PgBouncer would otherwise refuse the connection.
ignore_startup_parameters = extra_float_digits

;; Admin console: psql -p 6432 -U crimson pgbouncer (no target_session_attrs).
admin_users = crimson
stats_users = crimson

;; Set log_connections=1 temporarily to debug auth.
log_connections = 0
log_disconnections = 0
