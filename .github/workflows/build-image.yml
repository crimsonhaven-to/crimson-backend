name: Build and Deploy

# Build the backend image, push it to the PRIVATE GHCR, and roll it onto the swarm.
#
#   * push to `dev`       -> build :dev + :dev-<sha>, then deploy :dev-<sha> to the
#                            crimson-dev stack (see deploy-dev).
#   * published Release   -> build :<tag> + :latest and deploy :<tag> to prod with a
#                            health-gated rolling update. ALSO builds a separate
#                            CLEAN demo image (no source overlay) and rolls it onto
#                            the crimson-demo stack. See build-demo.
#
# Pull auth on the nodes: CI pushes with the ephemeral GITHUB_TOKEN, while runtime
# pulls use a durable `read:packages` login set up once on the manager. `docker stack
# deploy --with-registry-auth` ships those creds to every node, so re-pulls survive
# reboots and reschedules.
#
# Runner: the org-level self-hosted runner on the jumphost `server10` (Docker +
# buildx, passwordless SSH to the managers).

on:
  push:
    branches:
      - dev
    # Doc-only commits shouldn't rebuild + redeploy the dev image.
    paths-ignore:
      - '**.md'
  release:
    types: [published]

# One build/deploy per ref at a time: a second release waits rather than racing the
# rolling update. Never cancelled mid-flight.
concurrency:
  group: crimson-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crimsonhaven-to/crimson-backend
  # The swarm manager the deploy is driven against (reachable from the runner).
  SWARM_MANAGER: crimsonswarm01

jobs:
  # Quality gate: MUST pass before anything is built or deployed. Ruff correctness
  # rules + the fixture-based unit tests (pure parsing/crypto/signing; no network,
  # no DB). Runs inside the prod base image, so "it installs in CI" == "it imports
  # in the deployed container".
  gate:
    runs-on: [self-hosted]
    container: python:3.14-slim
    env:
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dev + runtime deps
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Lint (ruff, correctness rules)
        run: ruff check .

      - name: Type-check (mypy, informational)
        continue-on-error: true
        run: mypy . || true

      - name: Unit tests (pytest)
        run: pytest

      - name: Hand the workspace back to the host runner
        if: always()
        # This container writes as root into the shared self-hosted workspace, so
        # without this the next (host-run) job's checkout fails with EACCES.
        run: chmod -R a+rwX "$GITHUB_WORKSPACE" || true

  build:
    needs: gate
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      deploy: ${{ steps.meta.outputs.deploy }}
      # The immutable tag to deploy: vX.Y.Z on release, dev-<sha> on dev.
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VER="${{ github.event.release.tag_name }}"
            echo "version=${VER}"  >> "$GITHUB_OUTPUT"
            echo "deploy=true"      >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${VER},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "image_tag=${VER}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            echo "version="         >> "$GITHUB_OUTPUT"
            echo "deploy=false"     >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:dev,${IMAGE}:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            # Deploy the per-commit tag, not the rolling :dev, so the dev stack
            # always rolls to exactly this build.
            echo "image_tag=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (private)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Optional build-time source overlay (see the self-hosting docs): a repo
          # slug + token as BuildKit secrets, never baked into a layer. Commented out
          # to match the Dockerfile's disabled overlay stage; uncomment BOTH to use it.
          # secrets: |
          #   sources_pat=${{ secrets.SOURCES_PAT }}
          #   sources_repo=${{ secrets.SOURCES_REPO }}
          # Registry-backed layer cache keeps rebuilds fast across runner restarts.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: [self-hosted]
    steps:
      # Checkout at the release tag so we ship THIS release's stack definition.
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Ship stack file to the manager
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            docker-stack.yml "${SWARM_MANAGER}:/home/raymond/crimson-deploy/docker-stack.yml"

      - name: Deploy to the swarm
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" \
            "/home/raymond/crimson-deploy/deploy.sh '${{ needs.build.outputs.version }}'"

  # Dev auto-deploy: a push to `dev` rolls the just-built dev-<sha> onto the
  # crimson-dev stack. Unlike prod this ships NO stack file; the dev stack (bundling
  # its own Postgres) lives on the manager and CI just triggers its deploy.sh.
  deploy-dev:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted]
    steps:
      - name: Deploy to the dev swarm stack
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" \
            "/home/raymond/dev-crimson-deploy/deploy.sh '${{ needs.build.outputs.image_tag }}'"

  # --- Demo image: a CLEAN build with NO private source overlay -----------------
  # Release-only, alongside the prod `build`. It deliberately OMITS the
  # sources_pat/sources_repo secrets, and its SEPARATE buildcache ref (:democache)
  # guarantees it can never restore a source-bearing layer from the prod cache. The
  # crimson-demo stack runs it with DEMO_MODE=1 + PRIVATE_SOURCES_ENABLED=0, so the
  # demo resolves nothing.
  build-demo:
    needs: gate
    if: ${{ github.event_name == 'release' }}
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute demo image tags
        id: meta
        run: |
          VER="${{ github.event.release.tag_name }}"
          echo "tags=${IMAGE}:demo,${IMAGE}:demo-${VER}" >> "$GITHUB_OUTPUT"
          # Deploy the immutable per-release demo tag, not the rolling :demo.
          echo "image_tag=demo-${VER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (CLEAN, no source overlay)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # No `secrets:` block on purpose: never add one here, or the demo image
          # starts carrying private backend sources.
          cache-from: type=registry,ref=${{ env.IMAGE }}:democache
          cache-to: type=registry,ref=${{ env.IMAGE }}:democache,mode=max

  # Demo auto-deploy on release: roll the just-built demo-<tag> onto the crimson-demo
  # stack. Like the dev deploy it ships NO stack file; that stack (with its own
  # Postgres and the DEMO_MODE env) lives on the manager.
  deploy-demo:
    needs: build-demo
    if: ${{ github.event_name == 'release' }}
    runs-on: [self-hosted]
    steps:
      - name: Deploy to the demo swarm stack
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SWARM_MANAGER}" \
            "/home/raymond/demo-crimson-deploy/deploy.sh '${{ needs.build-demo.outputs.image_tag }}'"
